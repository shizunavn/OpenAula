name: Cloudflare Pages
on:
  pull_request:
    paths: ['src/**', 'public/**', 'worker/**', 'functions/**', 'index.html', 'vite.config.ts', 'package.json', 'package-lock.json', '.github/workflows/cloudflare.yml']
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'worker/**', 'functions/**', 'index.html', 'vite.config.ts', 'package.json', 'package-lock.json', '.github/workflows/cloudflare.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Fork pull requests must not see the Cloudflare token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Worker never runs on Pages, but its sources are shared with src/.
      - run: npm run typecheck:service
      # functions/ wraps worker/; Pages generates _routes.json from it.
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4 pages deploy dist --project-name open-aula --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
